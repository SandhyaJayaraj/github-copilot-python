<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Sudoku Game</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <h1>Sudoku Game</h1>
  <div id="sudoku-board"></div>
  <div class="controls">
    <label for="difficulty">Difficulty:</label>
    <select id="difficulty" name="difficulty">
      <option value="easy">Easy</option>
      <option value="medium" selected>Medium</option>
      <option value="hard">Hard</option>
    </select>
    <button id="theme-toggle" type="button" aria-pressed="false">Dark Mode</button>
    <button id="new-game">New Game</button>
    <button id="check-solution">Check Solution</button>
    <button id="hint">Hint</button>
    <span id="timer" aria-live="polite">00:00</span>
    <span id="message"></span>
  </div>
  <div id="score-form" class="score-form" hidden>
    <label for="score-name">Name:</label>
    <input id="score-name" type="text" maxlength="40">
    <button id="save-score">Save Score</button>
  </div>
  <section id="leaderboard" aria-labelledby="leaderboard-title">
    <h2 id="leaderboard-title">Top 10 Scores</h2>
    <table>
      <thead>
        <tr><th>Rank</th><th>Player</th><th>Time</th><th>Difficulty</th><th>Hints</th></tr>
      </thead>
      <tbody id="leaderboard-body"></tbody>
    </table>
  </section>
  <script src="/static/main.js"></script>
</body>
</html>
